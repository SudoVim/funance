name: Django Tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-22.04
    services:
      db_tests:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      PIPENV_VENV_IN_PROJECT: 1

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"

    - name: Install Dependencies
      run: |
        uv sync --locked

    - name: Check formatting
      run: |
        uv run ruff check --select I
        uv run ruff format --check

    - name: Run ruff check
      run: uv run ruff check

    - name: Run static analysis
      run: uv run basedpyright --warnings

    - name: Check migrations
      run: uv run python manage.py makemigrations --check

    - name: Run Tests
      run: uv run python manage.py test --noinput
